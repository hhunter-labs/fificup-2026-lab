name: Weekly Elo Rating Refresh

on:
  schedule:
    - cron: '0 6 * * 1'   # Every Monday at 6am UTC
  workflow_dispatch:        # Allow manual trigger from GitHub UI

jobs:
  refresh-elo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy requests

      - name: Fetch latest Elo ratings
        run: python scripts/fetch_elo_ratings.py

      - name: Commit updated ratings
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/teams.csv
          git diff --staged --quiet || git commit -m "chore: update Elo ratings [$(date -u +%Y-%m-%d)]"
          git push
